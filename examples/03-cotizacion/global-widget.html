<script>
// REGRESSION: the fallback mixes the selected unit with the first result.
(function () {
  if (window.demoQuoteHandler) document.removeEventListener('click', window.demoQuoteHandler, true);
  window.demoQuoteHandler = function (event) {
    const button = event.target.closest('.vehicle-action');
    if (!button) return;
    const clicked = button.closest('.vehicle-card');
    if (!clicked) return;
    event.preventDefault(); event.stopImmediatePropagation();
    // V4 path: correct while the selected card contains .grid-total.
    const pricing = clicked.querySelector('.grid-total');
    // Unsafe global fallback when switching to the V5 HTML.
    const resolved = pricing ? clicked : document.querySelector('.vehicle-card');
    const label = (pricing || resolved).querySelector('.vehicle-price');
    const cents = Math.round(Number(label.textContent.replace(/[^0-9.-]/g, '')) * 100);
    InventoryLab.showQuote(clicked, {
      sku: resolved.dataset.stock,
      name: resolved.querySelector('h2').textContent.trim(),
      cents
    }, 'Global regression: quote built from mixed selections');
  };
  document.addEventListener('click', window.demoQuoteHandler, true);
})();

</script>
